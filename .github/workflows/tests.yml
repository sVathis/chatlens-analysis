name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the scripts claim to support, and a current one
        python: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The scripts and their tests use only the standard library (the OpenAI package is
      # imported only when a real analysis runs), so there is nothing to pip install.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Each folder is its own start directory. The Skype tests load skype_analyze.py by path
      # and fake the OpenAI package, so they need no network and no pip install either.
      - name: Tests (shared link helper)
        run: python -m unittest discover -v

      - name: Tests (Skype)
        run: python -m unittest discover -s skype/tests -v

      # Skipped until viber/tests has a test_*.py: unittest exits with an error when it finds none.
      - name: Tests (Viber)
        if: ${{ hashFiles('viber/tests/test_*.py') != '' }}
        run: python -m unittest discover -s viber/tests -v

      - name: Tests (email)
        run: python -m unittest discover -s gmail/tests -v
